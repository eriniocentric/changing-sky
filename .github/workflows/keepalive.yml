name: Keep community database awake
# Free Supabase projects pause after 7 days without activity.
# This sends one read-only request to the public leaderboard every 3 days.
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read leaderboard (public, read-only)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_dB2VlyI9Vu_P90EjAU0_Dw_YZRWz_Fj" \
            "https://lnfxxsxmkecwedheyvuq.supabase.co/rest/v1/alert_scores?select=alert_id&limit=1")
          echo "Supabase responded with HTTP $code"
          test "$code" = "200"
